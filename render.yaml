services:
  - type: web
    name: growai-api
    runtime: docker

    plan: free

    dockerfilePath: ./Dockerfile

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: false

      - key: APP_URL
        sync: false

      - key: APP_KEY
        sync: false

      - key: DB_CONNECTION
        value: mysql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: 3306

      - key: DB_DATABASE
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: CACHE_STORE
        value: file

      - key: SESSION_DRIVER
        value: file

      - key: QUEUE_CONNECTION
        value: sync

      - key: LOG_CHANNEL
        value: stderr

      - key: FRONTEND_URL
        sync: false

      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false